<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HUDDLE" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
    <style>
      html, body, #root { margin: 0; padding: 0; background-color: #FFFFFF; }
      body {
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      /* Shown from the very first moment, before the app's code has loaded, so the screen is never blank.
         The app removes it once it has started. */
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #FFFFFF; color: #000000;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #boot-splash .brand { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
      #boot-splash .spinner {
        width: 22px; height: 22px; border-radius: 50%;
        border: 3px solid #E8E8E8; border-top-color: #000000;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot-splash .stuck { display: none; flex-direction: column; align-items: center; gap: 12px; padding: 0 32px; text-align: center; }
      #boot-splash.is-stuck .spinner { display: none; }
      #boot-splash.is-stuck .stuck { display: flex; }
      #boot-splash .stuck p { margin: 0; font-size: 15px; line-height: 21px; color: #8A8A8A; }
      #boot-splash button {
        font: inherit; font-size: 16px; font-weight: 600; color: #FFFFFF; background: #000000;
        border: 0; border-radius: 999px; padding: 14px 28px; cursor: pointer;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Huddle.</noscript>
    <div id="root"></div>

    <div id="boot-splash" role="status" aria-live="polite">
      <div class="brand">HUDDLE</div>
      <div class="spinner" aria-label="Loading"></div>
      <div class="stuck">
        <p>Huddle is taking longer than usual to open.</p>
        <button type="button" id="boot-reload">Tap to reload</button>
      </div>
    </div>

    <script>
      // If the app hasn't started after 15 seconds (very slow connection, or an outdated saved copy),
      // offer a reload that throws away the saved copy and fetches the latest version.
      (function () {
        var splash = document.getElementById("boot-splash");
        setTimeout(function () {
          if (document.getElementById("boot-splash")) splash.className = "is-stuck";
        }, 15000);
        document.getElementById("boot-reload").addEventListener("click", function () {
          var jobs = [];
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }));
            }
            if (window.caches && caches.keys) {
              jobs.push(caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }));
            }
          } catch (e) {}
          Promise.all(jobs).catch(function () {}).then(function () { window.location.reload(); });
        });
      })();
    </script>
  </body>
</html>
