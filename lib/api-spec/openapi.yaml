openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User economy operations
  - name: wagers
    description: Wager operations
  - name: fixtures
    description: Match fixture operations
  - name: posts
    description: Social timeline post operations
  - name: leaderboard
    description: Ranking operations
paths:
  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List timeline posts
      description: Returns all timeline posts, newest first.
      responses:
        "200":
          description: Posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a post
      description: Creates a new timeline post authored by the given user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "200":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Author not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Global leaderboard
      description: >-
        Returns all onboarded users ranked by points, highest first. Rank is
        assigned server-side.
      responses:
        "200":
          description: Ranked users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
  /leaderboard/members:
    post:
      operationId: getMemberLeaderboard
      tags: [leaderboard]
      summary: Private league leaderboard
      description: >-
        Returns the live, point-ranked standings for the given set of user ids.
        Ids that do not correspond to a real onboarded user are ignored, so only
        genuine members of the league are ranked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaderboardMembersInput"
      responses:
        "200":
          description: Ranked members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /fixtures:
    get:
      operationId: listFixtures
      tags: [fixtures]
      summary: List upcoming fixtures
      description: >-
        Returns upcoming match fixtures with pre-match odds, served strictly
        from the local cache populated by the background fetch job. Clients must
        never call the external sports API directly.
      responses:
        "200":
          description: Upcoming fixtures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fixture"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /users/sync:
    post:
      operationId: syncUser
      tags: [users]
      summary: Create or update a user
      description: Upserts a user. New users start with the default bankroll.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSyncInput"
      responses:
        "200":
          description: Synced user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/{id}/wagers:
    get:
      operationId: listWagers
      tags: [wagers]
      summary: List a user's wagers
      description: >-
        Returns all wagers placed by the user, newest first.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Wager list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Wager"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: placeWager
      tags: [wagers]
      summary: Place a wager
      description: >-
        Atomically verifies the user has enough points at the moment of the
        transaction, deducts the stake, and records the wager.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WagerInput"
      responses:
        "200":
          description: Wager placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WagerResult"
        "400":
          description: Invalid input or insufficient points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/{id}/wagers/{wagerId}/settle:
    post:
      operationId: settleWager
      tags: [wagers]
      summary: Settle a wager
      description: >-
        Atomically resolves a pending wager. On a win the payout is credited to
        the user's balance.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: wagerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WagerSettleInput"
      responses:
        "200":
          description: Wager settled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WagerResult"
        "400":
          description: Invalid input or wager already settled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User or wager not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/{id}/daily:
    post:
      operationId: claimDaily
      tags: [users]
      summary: Claim the daily bonus
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Daily claim result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResult"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/{id}/bailout:
    post:
      operationId: claimBailout
      tags: [users]
      summary: Claim a bankruptcy bailout
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Bailout claim result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResult"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        username: { type: string }
        displayName: { type: string }
        dob: { type: string }
        avatarColor: { type: string }
        winRate: { type: number }
        currentStreak: { type: integer }
        points: { type: integer }
        isBankrupt: { type: boolean }
        previousWagers: { type: integer }
        lastDailyClaim: { type: ["string", "null"], format: date-time }
        profileComplete: { type: boolean }
      required:
        - id
        - email
        - username
        - displayName
        - dob
        - avatarColor
        - winRate
        - currentStreak
        - points
        - isBankrupt
        - previousWagers
        - lastDailyClaim
        - profileComplete
    Fixture:
      type: object
      properties:
        id: { type: string }
        competition: { type: string }
        homeTeam: { type: string }
        awayTeam: { type: string }
        startTime: { type: string, format: date-time }
        oddsHome: { type: number }
        oddsDraw: { type: number }
        oddsAway: { type: number }
      required:
        - id
        - competition
        - homeTeam
        - awayTeam
        - startTime
        - oddsHome
        - oddsDraw
        - oddsAway
    Wager:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        fixtureId: { type: string }
        choice: { type: string }
        question: { type: string }
        prediction: { type: string }
        amount: { type: integer }
        odds: { type: number }
        potentialPayout: { type: integer }
        status: { type: string }
        payout: { type: integer }
        createdAt: { type: string, format: date-time }
        settledAt: { type: ["string", "null"], format: date-time }
      required:
        - id
        - userId
        - fixtureId
        - choice
        - question
        - prediction
        - amount
        - odds
        - potentialPayout
        - status
        - payout
        - createdAt
        - settledAt
    Post:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        username: { type: string }
        displayName: { type: string }
        avatarColor: { type: string }
        text: { type: string }
        createdAt: { type: string, format: date-time }
      required:
        - id
        - userId
        - username
        - displayName
        - avatarColor
        - text
        - createdAt
    PostInput:
      type: object
      properties:
        userId: { type: string, minLength: 1 }
        text: { type: string, minLength: 1, maxLength: 280 }
      required:
        - userId
        - text
    LeaderboardEntry:
      type: object
      properties:
        userId: { type: string }
        username: { type: string }
        displayName: { type: string }
        avatarColor: { type: string }
        points: { type: integer }
        winRate: { type: number }
        rank: { type: integer }
      required:
        - userId
        - username
        - displayName
        - avatarColor
        - points
        - winRate
        - rank
    LeaderboardMembersInput:
      type: object
      properties:
        userIds:
          type: array
          items: { type: string }
      required:
        - userIds
    UserSyncInput:
      type: object
      properties:
        id: { type: string, minLength: 1 }
        email: { type: string, minLength: 1 }
        username: { type: string }
        displayName: { type: string }
        dob: { type: string }
        avatarColor: { type: string }
        profileComplete: { type: boolean }
      required:
        - id
        - email
    WagerInput:
      type: object
      properties:
        fixtureId: { type: string, minLength: 1 }
        choice: { type: string, minLength: 1 }
        question: { type: string }
        prediction: { type: string }
        amount: { type: integer, minimum: 1 }
        odds: { type: number, minimum: 1 }
      required:
        - fixtureId
        - choice
        - amount
        - odds
    WagerSettleInput:
      type: object
      properties:
        won: { type: boolean }
      required:
        - won
    WagerResult:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        wager: { $ref: "#/components/schemas/Wager" }
      required:
        - user
        - wager
    ClaimResult:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        claimed: { type: boolean }
      required:
        - user
        - claimed
